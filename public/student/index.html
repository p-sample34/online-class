<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Panel | Online Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>👨‍🎓 Welcome, <span id="studentName"></span></h1>

    <div id="questionContainer">
      <h2 id="questionBox">Waiting for teacher to send a question...</h2>
      <p id="timer"></p>
    </div>

    <div id="answerBox" style="display:none;">
      <textarea id="answer" placeholder="Write your answer here..."></textarea>
      <button onclick="submitAnswer()">Submit Answer</button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <script>
    // Backend Render URL
    const API_URL = "https://online-class-m8h6.onrender.com";

    // Connect to backend socket server
    const socket = io(API_URL, {
      transports: ["websocket", "polling"]
    });

    const studentName = localStorage.getItem("studentName");
    document.getElementById("studentName").innerText = studentName || "Student";

    // FIXED: correct event name — server emits "new-question"
    socket.on("new-question", (data) => {
      const { question, timeLimit } = data;

      document.getElementById("questionBox").innerText = question;
      document.getElementById("answerBox").style.display = "block";

      let timeLeft = parseInt(timeLimit);
      document.getElementById("timer").innerText = `⏱️ Time left: ${timeLeft}s`;

      const timer = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").innerText = `⏱️ Time left: ${timeLeft}s`;

        if (timeLeft < 0) {
          clearInterval(timer);
          submitAnswer();
        }
      }, 1000);
    });

    // FIXED: Correct API route → /student/submit
    async function submitAnswer() {
      const answer = document.getElementById("answer").value.trim();

      if (!answer) {
        alert("Please write your answer before submitting.");
        return;
      }

      const res = await fetch(`${API_URL}/student/submit`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ studentName, answer }),
      });

      const data = await res.json();

      if (data.success) {
        // FIXED: correct event name — server listens for "student-answer"
        socket.emit("student-answer", { studentName, answer });

        alert("Answer submitted!");

        document.getElementById("answer").value = "";
        document.getElementById("answerBox").style.display = "none";
        document.getElementById("timer").innerText = "";
      } else {
        alert("Error submitting answer.");
      }
    }
  </script>
</body>
</html>
